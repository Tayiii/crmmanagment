[project]
name = "crmmanagment"
version = "0.1.0"
description = "MVP internal work item management system for enterprise"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9"
]

[tool.setuptools]
packages = ["app"]
